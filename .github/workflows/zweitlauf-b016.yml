# S2-56 (round 12): restate the final theorem for <4,2,4> in a fresh file and print
# its elaborated statement and axioms. The file lean/Zweitlauf/B016Aussage.lean is not a
# lake target; it is checked with `lake env lean`. lean-project.yml is unchanged.

name: Second run B-016 (fresh statement file)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/zweitlauf-b016.yml"
      - "lean/Zweitlauf/**"
  push:
    branches: [main, portierung]
    paths:
      - ".github/workflows/zweitlauf-b016.yml"
      - "lean/Zweitlauf/**"

permissions:
  contents: read

concurrency:
  group: zweitlauf-b016-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check fresh statement file
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Commit, toolchain and mathlib revision
        run: |
          set -euo pipefail
          echo "commit: $(git rev-parse HEAD)"
          echo "GITHUB_SHA: $GITHUB_SHA"
          tc="$(tr -d '[:space:]' < lean-toolchain)"
          echo "lean-toolchain: $tc"
          echo "LEAN_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          rev="$(python3 -c 'import json; print({p["name"]: p["rev"] for p in json.load(open("lake-manifest.json"))["packages"]}["mathlib"])')"
          echo "mathlib rev: $rev"
          echo "MATHLIB_REV=$rev" >> "$GITHUB_ENV"
          echo "sha256 of the fresh file:"
          sha256sum Zweitlauf/B016Aussage.lean

      - name: Install elan and toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$LEAN_TOOLCHAIN"
          lean --version
          lake --version

      - name: Fetch official mathlib build cache
        run: |
          set -euo pipefail
          lake exe cache get
          git diff --exit-code -- lake-manifest.json lakefile.toml lean-toolchain

      - name: Build the imported modules
        run: |
          set -euo pipefail
          lake build YangBounds.Basic YangBounds.Transponiert444

      - name: Show the fresh file
        run: cat -n Zweitlauf/B016Aussage.lean

      - name: Check the fresh file (lake env lean)
        run: |
          set -euo pipefail
          lake env lean Zweitlauf/B016Aussage.lean 2>&1 | tee "$RUNNER_TEMP/out.txt"
          {
            echo "### Output of \`lake env lean Zweitlauf/B016Aussage.lean\`"
            echo '```'
            cat "$RUNNER_TEMP/out.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
