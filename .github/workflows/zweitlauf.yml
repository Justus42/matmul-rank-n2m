# S2-55 (round 12): second, independent machine run for the Lean project under lean/.
#
# 1. Fresh checkout of the target commit (default: current main), build of lean/ without
#    any carried-over build artifacts of the project. No actions/cache is used at all.
#    Only the official mathlib cache (`lake exe cache get`) is allowed.
# 2. Kernel re-check over every module of the project. Up to Lean v4.29 this used the
#    separate repository leanprover/lean4checker (tag matching the toolchain). From the
#    Palomar port (S5-03, Lean v4.36.0) on, the checker shipped with the toolchain
#    (`leanchecker`, same command line) is used, because lean4checker has no tags
#    beyond v4.29.0-rc8. The dependency mm325_lower_bound was removed in S5-03.
# 3. `#print axioms` for YangBounds.Transponiert444.rank_four_two_four_ge_26.
#    S5-21: also for YangBounds.Gleich444.rank_four_two_four_eq_26 and for the Palomar
#    Solution theorem MatMulRank.rank_four_two_four_eq_26 (statement of the Challenge).
#    The Challenge itself is not imported, because it declares the same name.
#
# S5-16: on the branch portierung the run also starts on every push that changes lean/**,
# so the current state of portierung gets its second run without a manual dispatch.
#
# Nothing under lean/ is changed. The existing workflows lean-project.yml and
# lean-build.yml and their script are not used or touched.

name: Second run (fresh build + lean4checker)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to check (default: main)"
        required: false
        default: "main"
  pull_request:
    paths:
      - ".github/workflows/zweitlauf.yml"
  push:
    branches: [portierung]
    paths:
      - ".github/workflows/zweitlauf.yml"
      - "lean/**"

permissions:
  contents: read

concurrency:
  group: zweitlauf-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_REF: ${{ github.event.inputs.ref || github.event.pull_request.head.sha || github.sha }}
  FINAL_THEOREM: YangBounds.Transponiert444.rank_four_two_four_ge_26
  EXTRA_THEOREMS: YangBounds.Gleich444.rank_four_two_four_eq_26 MatMulRank.rank_four_two_four_eq_26

jobs:
  zweitlauf:
    name: Fresh build, lean4checker, axioms
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: Fresh checkout of the target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          path: target
          fetch-depth: 1

      - name: Record commit and confirm there are no build artifacts
        working-directory: target
        run: |
          set -euo pipefail
          echo "TARGET_REF: $TARGET_REF"
          echo "CHECKED COMMIT: $(git rev-parse HEAD)"
          git log -1 --format='commit date: %cI%nsubject: %s'
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -e lean/.lake ]; then echo "ERROR: lean/.lake exists after checkout"; exit 1; fi
          n="$(find . -name '*.olean' -o -name '*.ilean' -o -name '*.trace' | wc -l)"
          echo "olean/ilean/trace files in fresh checkout: $n"
          [ "$n" -eq 0 ]
          echo "elan dir before install: $(ls -d "$HOME/.elan" 2>/dev/null || echo none)"
          echo "mathlib cache dir before install: $(ls -d "$HOME/.cache/mathlib" 2>/dev/null || echo none)"

      - name: Read toolchain and mathlib revision
        working-directory: target/lean
        run: |
          set -euo pipefail
          tc="$(tr -d '[:space:]' < lean-toolchain)"
          echo "lean-toolchain: $tc"
          echo "LEAN_TOOLCHAIN=$tc" >> "$GITHUB_ENV"
          python3 - <<'EOF'
          import json
          for p in json.load(open("lake-manifest.json"))["packages"]:
              print(f"manifest package {p['name']}: {p['rev']} ({p['url']})")
          EOF

      - name: Install elan and toolchain (no cache)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$LEAN_TOOLCHAIN"
          cd target/lean
          lean --version
          lake --version

      - name: Fetch official mathlib cache
        working-directory: target/lean
        run: |
          set -euo pipefail
          lake exe cache get
          git diff --exit-code -- lake-manifest.json lakefile.toml lean-toolchain
          if [ -e .lake/build ]; then echo "ERROR: project build dir exists before build"; exit 1; fi
          echo "project .lake/build absent before build: OK"
          for d in .lake/packages/*; do
            echo "package $(basename "$d"): $(git -C "$d" rev-parse HEAD)"
          done

      - name: Build library YangBounds (all modules)
        working-directory: target/lean
        run: |
          set -euo pipefail
          lake build 2>&1 | tee "$RUNNER_TEMP/build.txt"
          echo "----- build summary -----"
          echo "lines with 'sorry': $(grep -c "sorry" "$RUNNER_TEMP/build.txt" || true)"
          grep -n "sorry" "$RUNNER_TEMP/build.txt" || echo "(no line contains 'sorry')"
          echo "lines with 'error': $(grep -ci "error" "$RUNNER_TEMP/build.txt" || true)"
          echo "warning lines: $(grep -c "warning" "$RUNNER_TEMP/build.txt" || true)"
          grep -n "warning" "$RUNNER_TEMP/build.txt" | head -50 || true
          tail -n 3 "$RUNNER_TEMP/build.txt"
          git status --porcelain
          git diff --exit-code

      - name: Locate leanchecker shipped with the toolchain
        working-directory: target/lean
        run: |
          set -euo pipefail
          bin="$(dirname "$(elan which lean)")/leanchecker"
          test -x "$bin"
          echo "leanchecker: $bin"
          echo "L4C_BIN=$bin" >> "$GITHUB_ENV"

      - name: leanchecker over every project module
        working-directory: target/lean
        run: |
          set -uo pipefail
          modlist() {
            # $1: build lib dir; prints module names of all .olean files below it
            find "$1" -name '*.olean' | sed -e "s|^$1/||" -e 's|\.olean$||' -e 's|/|.|g' | sort
          }
          libdir() { if [ -d "$1/lib/lean" ]; then echo "$1/lib/lean"; else echo "$1/lib"; fi; }
          proj_lib="$(libdir .lake/build)"
          modlist "$proj_lib" > "$RUNNER_TEMP/proj_mods.txt"
          echo "project modules ($(wc -l < "$RUNNER_TEMP/proj_mods.txt")):"; cat "$RUNNER_TEMP/proj_mods.txt"
          echo "source files lean/YangBounds/*.lean: $(ls YangBounds/*.lean | wc -l)"
          ok=0; bad=0
          for list in proj_mods; do
            while read -r m; do
              [ -z "$m" ] && continue
              echo "===== lean4checker $m"
              lake env "$L4C_BIN" "$m"
              rc=$?
              echo "L4C-RESULT|$list|$m|exit=$rc"
              if [ $rc -eq 0 ]; then ok=$((ok+1)); else bad=$((bad+1)); fi
            done < "$RUNNER_TEMP/$list.txt"
          done
          echo "L4C-SUMMARY|checked=$((ok+bad))|ok=$ok|failed=$bad"
          echo "L4C-SUMMARY|checked=$((ok+bad))|ok=$ok|failed=$bad" > "$RUNNER_TEMP/l4c_summary.txt"
          [ $bad -eq 0 ]

      - name: "#print axioms for the final theorem and the statement 26"
        if: always()
        working-directory: target/lean
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/ZweitlaufAxioms.lean"
          {
            printf 'import YangBounds.Transponiert444\nimport YangBounds.Gleich444\nimport MatMulRank.Solution\n'
            for t in $FINAL_THEOREM $EXTRA_THEOREMS; do
              printf '#check @%s\n#print axioms %s\n' "$t" "$t"
            done
          } > "$f"
          cat "$f"
          echo "-----"
          lake env lean "$f" 2>&1 | tee "$RUNNER_TEMP/axioms.txt"

      - name: leanchecker --fresh on the final theorem's module (at most 30 minutes)
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        working-directory: target/lean
        run: |
          set -uo pipefail
          lake env "$L4C_BIN" --fresh YangBounds.Transponiert444
          rc=$?
          echo "L4C-FRESH|YangBounds.Transponiert444|exit=$rc"
          exit $rc

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Second run (S2-55)"
            echo "- checked commit: \`${TARGET_SHA:-unknown}\`"
            echo "- toolchain: \`${LEAN_TOOLCHAIN:-unknown}\`"
            echo "- lean4checker: $(cat "$RUNNER_TEMP/l4c_summary.txt" 2>/dev/null || echo 'not run')"
            echo '```'
            cat "$RUNNER_TEMP/axioms.txt" 2>/dev/null || echo "(axioms not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
